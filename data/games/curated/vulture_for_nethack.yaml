evidence:
  item_identification: Potions, scrolls, wands, rings and amulets appear under randomized names each game; price-identifying,
    engrave-testing and scrolls of identify are core skills.
  luck_stat: Hidden Luck value (-13..+13) shifts to-hit, prayer, wishes and many random outcomes; luckstones lock
    it in.
  knowledge_progression: No meta-progression at all; NetHack is a full traditional roguelike where only player knowledge
    (spoilers) carries between games.
  cursed_items: Blessed/uncursed/cursed (BUC) status on every item; cursed gear cannot be removed and cursed loadstones
    are infamous.
  hunger_clock: Nutrition counter forces eating; starvation kills, overeating can choke.
  monster_capture: Scrolls of taming, magic harps and thrown food tame monsters into pets; polymorph lets you become
    monsters.
