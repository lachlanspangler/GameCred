evidence:
  pick_one_of_n: "Wiki 'Upgrades': rescuing a level's prisoner offers 1 of 5 random upgrades (~40 total, each with a per-run limit); loops cut this to 2."
  stealth: "Wiki 'Stealth': enemies have hidden fields of view and must spot you first; attacks on unaware enemies deal critical damage."
  summons_minions: "Wiki 'Companions': the companion upgrade turns a rescued prisoner into an ally you arm with found guns; no hard limit."
  loadout_start: "Wiki 'Loadouts': per-character starting weapon/ammo loadouts unlocked by feats (kill 200 enemies, reach the first boss area...)."
  endless_mode: "Wiki 'Looped run': loop instead of finishing to replay a new run with more enemies, elites, traps and boss HP, keeping your loadout and upgrades."
  modular_difficulty: "Wiki 'Run settings': toggle permadeath, seed, boss health, container/ammo/health drops and enemy attention; big changes disable achievements."
  act_structure: "Wiki 'Run': 3 areas (Farms, Wilderness, ...) of 3 levels plus a boss level, then backtrack through 9 B-Levels with new enemies and loot."
