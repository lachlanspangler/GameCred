evidence:
  physics_simulation: Every pixel is simulated - liquids flow, fire spreads, gases explode, terrain is destructible.
  crafting: Wands are built by arranging spells in slots; spell order, modifiers and triggers define behaviour.
  healing_scarcity: Healing is nearly absent outside Holy Mountain refills between levels.
  pick_one_of_n: Holy Mountain offers a choice of perks after each level.
  double_edged_items: Perks like Glass Cannon and potions like polymorphine trade power for risk.
  traversal_tools: Levitation is a constant movement resource; digging and teleport wands reshape routes.
  spell_programming: Wands fire their spell slots in order, and modifiers and multicasts change the result (the core building system).
  projectile_modifiers: Wand modifier spells add homing, bouncing, piercing and trajectory changes to cast projectiles.
  secret_areas: Hidden areas, secret orbs, alchemy recipes and puzzle unlocks reward exploration and community discovery.
