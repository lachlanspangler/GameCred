evidence:
  enemy_intents: Vek telegraph every attack tile before the player moves; the whole turn is solving those telegraphs.
  perfect_information: No hit chance; damage, pushes and spawn points are shown exactly in advance.
  environmental_hazards: Push/pull Vek into water, chasms, mines, fire and each other is the main damage source.
  achievement_unlocks: Squad achievements award coins spent to unlock new mech squads.
  permadeath: Losing the power grid ends the timeline; one pilot may be sent back to the next run.
  turn_rewind: Once per battle the player can reset the current turn to undo their moves.
