evidence:
  permanent_stat_upgrades: Credits collected in runs buy permanent upgrades to health, damage, energy, luck and armor between runs.
  character_classes: Each run starts by choosing one of several randomly offered assets (e.g. Hacker, Assassin, Cyber Soldier) with different stats and perks.
  pick_one_of_n: Enhancement stations offer a choice of cybernetic enhancements that persist for the rest of the run.
  environmental_hazards: Most walls and cover are destructible and explosive objects can be shot to clear rooms.
  boss_gates: Boss floors punctuate the climb up the tower; beating a boss lets later runs start from that floor.
