evidence:
  day_night_cycle: Each expedition is Day 1, Day 2, then a Nightlord fight; each day ends with a night boss as the map closes in.
  time_pressure: The Night's Tide circle shrinks on a fixed schedule and drives the whole party toward the day boss.
  open_procgen_world: Limveld's base layout is fixed, but camps, castles, field bosses and Shifting Earth events roll per expedition.
  passive_relics: Relics with rolled effects go into Vessel slots at Roundtable Hold before the run and shape every expedition.
  second_chance: Downed teammates can be revived by hitting them; full death on a day drops a level and some runes instead of ending the run.
  ascension_ladder: Deep of Night mode adds ranked Depth tiers with harsher enemies and better loot.
