evidence:
  knowledge_progression: Nothing mechanical carries over; deciphering what each card/verb combination does is the
    real progression.
  stress_sanity: Dread and Fascination cards accumulate and, if they fill the Despair/Visions slots, end the run.
  time_pressure: Every verb and card decays on a real-time timer (pausable); Seasons tick toward hostile events.
  unlock_characters: Endings unlock new Legacies (starting characters) such as the Detective and Physician.
  resource_conversion: Work turns Health into Funds, Dream turns Passion into Lore, rites turn Followers and Influences
    into ascension progress.
  multiple_endings: Ascensions via Lantern, Grail, Moth, Forge and others, plus many failure endings.
