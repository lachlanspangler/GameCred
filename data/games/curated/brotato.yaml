evidence:
  waves: Runs are 20 timed waves with a shop after every wave and a boss on wave 20.
  interest_economy: The Harvesting stat pays materials at wave end and grows over the run, rewarding early economy investment.
  double_edged_items: Most items mix positive and negative stats, and characters impose hard rule-bending drawbacks.
  transformations: Weapon class set bonuses (Primitive, Gun, Elemental, etc.) scale with how many same-class weapons are held.
  ascension_ladder: Danger 0-5 difficulty levels unlock per character after winning the previous level.
  rng_mitigation: Shop items can be locked to persist through rerolls and into the next wave.
  prep_combat_phases: Every wave is followed by a shop/upgrade phase before the next combat wave.
  luck_stat: Luck is an explicit stat that raises the chance of material drops, rarer shop items and luck-based item effects.
