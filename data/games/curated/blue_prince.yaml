evidence:
  tile_placement_world: Each day the player drafts room blueprints onto Mount Holly's 5x9 grid, building the house they explore.
  pick_one_of_n: Opening a door offers three blueprints; gems pay for the pricier rooms.
  hunger_clock: Every room entered costs a step and the day ends at zero; food rooms and items restore steps.
  reroll: Dice let the player redraw the current set of blueprint options.
  narrative_across_runs: The house resets daily, but knowledge, story clues and a few permanent upgrades carry forward toward Room 46 and beyond.
