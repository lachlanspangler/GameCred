evidence:
  time_pressure: Survive a fixed 20-minute timer until dawn; enemy pressure escalates with the clock.
  twin_stick: Manual mouse aim with reloading guns; auto-aim is an optional setting.
  build_archetypes: Level-up upgrades are organized into themed trees (fire, frost, lightning, summons) with prerequisites.
  loadout_start: Each run picks a character, a gun and a map before starting.
  ascension_ladder: Darkness levels 1-15 stack difficulty modifiers after a win.
  weapon_handling: Guns have magazines and manual reload timing is part of the skill ceiling.
  pickup_magnet_economy: XP drops must be collected and pickup range is an upgradable stat (e.g. Magnet-style upgrades).
  aim_mode_options: Players can toggle between auto-aim and manual mouse aim.
  projectile_modifiers: Bullet upgrades such as Splinter, Fan Fire, Reaper Rounds (pierce) and Ricochet change projectile behaviour.
