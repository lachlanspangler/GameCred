evidence:
  synergies: Hundreds of named gun/item synergies upgrade weapons when specific pairs are held.
  item_rarity: Items and chests are graded D/C/B/A/S with matching chest colours.
  environmental_hazards: Flippable tables for cover, explosive barrels, and pits.
  hub_building: Rescuing NPCs in the Gungeon expands the Breach shops with new unlocks.
  multiple_endings: Each Gungeoneer must kill their Past via the Bullet that Can Kill the Past for a personal ending.
  cursed_items: Curse stat raises Jammed enemy and Lord of the Jammed appearance chances.
  corruption_meter: Curse from cursed items and choices raises Jammed enemy spawns and summons the Lord of the Jammed.
  projectile_modifiers: Items like Scattershot, Bouncy Bullets and Homing Bullets alter every projectile fired.
  secret_areas: Blanks and explosives reveal secret rooms, and hidden floors (Oubliette, Abbey) require exploration.
