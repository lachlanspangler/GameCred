# GameCred Mechanic Taxonomy ("the textbook")
#
# Hierarchy: family -> subfamily -> mechanic.
# Every mechanic id is globally unique (snake_case) and is what game profiles reference.
#
# Per-mechanic fields:
#   name         human label
#   desc         one-line definition (what must be true for a game to "have" it)
#   steam_tags   Steam user tags that imply this mechanic (auto-tagger, confidence 0.7)
#   keywords     lowercase phrases searched in store descriptions (auto-tagger, confidence 0.4)
#   aliases      alternative ids/names accepted by the validator (self-healing renames)
#
# Intensity in game profiles: 1 = present, 2 = significant, 3 = core pillar of the game.
version: 3

families:

  run_structure:
    name: Run Structure
    desc: How a single run is shaped, bounded and repeated.
    subfamilies:
      death_and_persistence:
        name: Death & Persistence
        mechanics:
          permadeath:
            name: Permadeath
            desc: Losing ends the run; the run's state is discarded.
            steam_tags: [Permadeath, Perma Death]
            keywords: [permadeath, "permanent death", "death is permanent"]
          mid_run_save:
            name: Mid-run Save & Quit
            desc: A run can be suspended and resumed later (no save-scumming).
            keywords: ["save and quit", "suspend your run", "resume your run"]
          second_chance:
            name: Revive / Extra Life
            desc: Items or systems that prevent a single death from ending the run.
            keywords: ["extra life", "extra lives", revive, resurrect]
          extraction:
            name: Extraction / Bank-out
            desc: Player may leave a run early to keep loot; dying forfeits it.
            steam_tags: [Extraction Shooter]
            keywords: [extraction, "extract with", "escape with your loot"]
          legacy_inheritance:
            name: Heirs / Legacy Inheritance
            desc: The next run's character is an heir with rolled traits or inherits from the fallen (Rogue Legacy).
            keywords: [heir, heirs, lineage, descendants, "your children"]
          breeding_genetics:
            name: Breeding / Genetics
            desc: New units are bred from previous ones, passing traits (Mewgenics).
            keywords: [breed, breeding, genetics, offspring]
      procedural_generation:
        name: Procedural Generation
        mechanics:
          procgen_levels:
            name: Procedural Levels
            desc: Level layouts are generated per run.
            steam_tags: [Procedural Generation]
            keywords: ["procedurally generated", "procedural generation", "randomly generated", "every run is different", "never the same"]
          node_map:
            name: Branching Node Map
            desc: Player chooses a path through a graph of encounter nodes (StS-style map).
            keywords: ["branching path", "choose your path", "map of", "branching map"]
          room_based_floors:
            name: Room-based Floors
            desc: Floors composed of discrete rooms cleared one at a time (Isaac/Hades-style).
            keywords: ["room by room", chambers, "each room"]
          tile_placement_world:
            name: Player-built Level Tiles
            desc: The player places tiles/cards that construct the world the hero traverses (Loop Hero, Guild of Dungeoneering).
            keywords: ["place tiles", "build the dungeon", "lay down tiles", "build the world"]
          open_procgen_world:
            name: Open Procedural World
            desc: Continuous generated world explored freely within a run.
            steam_tags: [Open World, Exploration]
            keywords: ["open world", "explore a vast"]
          seeded_runs:
            name: Seeded Runs
            desc: Players can enter/share a seed to replay an identical run.
            keywords: [seeded, "custom seeds", "seed sharing"]
          daily_challenge:
            name: Daily / Weekly Challenge
            desc: Shared fixed-seed challenge with leaderboard on a schedule.
            keywords: ["daily challenge", "daily run", "weekly challenge", "daily seed"]
          handcrafted_loop_world:
            name: Handcrafted Looping World
            desc: Hand-built (not generated) world that resets each loop while chosen progress persists (Ultros, Returnal).
            keywords: ["time loop", "loop resets", "each loop"]
      run_shape:
        name: Run Shape & Length
        mechanics:
          act_structure:
            name: Acts / Biomes
            desc: Run divided into distinct themed stages with escalating difficulty.
            keywords: [biomes, "distinct zones", "unique biomes", "three acts"]
          boss_gates:
            name: Boss Gates
            desc: Stage ends with a boss that must be defeated to proceed.
            keywords: ["boss at the end", "boss fights", "epic bosses", "challenging bosses"]
          short_runs:
            name: Short Runs (<30 min)
            desc: A typical full run takes under ~30 minutes.
            keywords: ["30 minute", "short runs", "quick runs", "bite-sized", "bite sized"]
          long_runs:
            name: Long Runs (>90 min)
            desc: A typical full run takes over ~90 minutes.
            keywords: ["epic runs", "long runs"]
          endless_mode:
            name: Endless Mode
            desc: Run can continue indefinitely past the nominal end.
            keywords: ["endless mode", "infinite mode"]
          time_pressure:
            name: Run Timer / Time Pressure
            desc: Difficulty or failure escalates with real time (RoR2, Survivors timer).
            steam_tags: [Time Management]
            keywords: ["the longer you", "difficulty increases over time", "survive for", "against the clock"]
          minute_spawn_schedule:
            name: Clock-scripted Spawns
            desc: Enemy composition is scripted by elapsed minutes rather than waves or rooms (Vampire Survivors).
            keywords: ["every minute", "minute by minute", "survive until"]
          multiple_endings:
            name: Multiple Endings / True Ending
            desc: Run outcomes branch into different endings, often a hidden true ending.
            steam_tags: [Multiple Endings]
            keywords: ["multiple endings", "true ending", "secret ending"]

          turn_escalation:
            name: Per-turn Escalation
            desc: Pressure rises per turn/jump/action rather than real time (FTL rebel fleet, Invisible Inc alarm).
            keywords: ["rebel fleet", "alarm level", "each turn the"]
          day_night_cycle:
            name: In-run Clock / Day Cycle
            desc: An in-run day count or clock structures exploration and forces the climax (Ravenswatch, Atomicrops).
            keywords: ["day and night", "day/night", "day-night cycle", "night falls"]
          prep_combat_phases:
            name: Build / Combat Phases
            desc: Each cycle alternates a preparation/build phase with a combat phase (The Last Spell, Brotato shop).
            keywords: ["build phase", "prepare your defenses", "between waves"]
  meta_progression:
    name: Meta-Progression
    desc: What persists between runs and how it changes future runs.
    subfamilies:
      persistent_power:
        name: Persistent Power
        mechanics:
          permanent_stat_upgrades:
            name: Permanent Stat Upgrades
            desc: Currency spent between runs on permanent stat boosts (Rogue Legacy, Hades mirror).
