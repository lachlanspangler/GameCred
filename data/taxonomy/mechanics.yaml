            keywords: [party, recruit, roster, "your team", "your heroes"]
          summons_minions:
            name: Summons / Minions
            desc: Persistent allied units summoned or deployed; builds around them (Monster Train, Rift Wizard).
            keywords: [summon, summons, minions, undead army]
          monster_capture:
            name: Monster Capture / Possession
            desc: Capture, tame or possess enemies to use as allies or forms (Abyss Odyssey, Patch Quest).
