          pickup_magnet_economy:
            name: Pickup Collection / Magnet
            desc: XP/currency drops must be physically collected; pickup radius is an upgradable stat (survivors-likes).
            keywords: ["xp gems", "experience gems", magnet, "pickup radius", "pick-up range"]
          skill_tags:
            name: Tag-based Scaling
            desc: Abilities carry tags (fire, projectile, area) and upgrades scale by tag (Soulstone Survivors, Halls of Torment).
            keywords: ["skill tags", "ability tags", "tag-based"]
          spell_programming:
            name: Spell Programming
            desc: Ordered slots of spells/modifiers in a wand or caster determine the output (Noita, Magicraft).
