          skill_tree_meta:
            name: Meta Skill Tree
            desc: Branching tree of persistent unlocks/talents.
            keywords: ["skill tree", "talent tree", "upgrade tree"]
          hub_building:
            name: Hub / Base Building
            desc: Player builds or upgrades a persistent hub between runs.
            steam_tags: [Base Building, Building, Town Building, "Base-Building"]
            keywords: ["upgrade your base", "build your town", "home base", "your hub"]
          life_sim_hub:
            name: Life-sim Hub Layer
            desc: Non-combat social/farming/management layer between runs (Cult of the Lamb, Atomicrops).
            steam_tags: [Farming Sim, Life Sim]
            keywords: [farm, farming, "manage your cult", "life sim"]
          shop_management:
            name: Shopkeeping Between Runs
            desc: Sell run loot in a shop you run (Moonlighter).
            keywords: ["run a shop", "your shop", shopkeeper, "sell your loot"]
      content_unlocks:
        name: Content Unlocks
        mechanics:
          unlock_items:
            name: Item/Card Pool Unlocks
            desc: New items/cards/relics added to the pool through play.
            keywords: ["unlock new", unlockable, "unlock more", unlocks]
          unlock_characters:
            name: Unlockable Characters
            desc: New playable characters gained through play.
            keywords: ["unlock new characters", "unlockable characters", "unlock characters", "new heroes"]
          achievement_unlocks:
            name: Challenge-gated Unlocks
            desc: Specific feats (not currency) unlock content (Isaac/RoR2 achievements).
            keywords: ["complete challenges to unlock", achievements unlock]
          traversal_unlocks:
            name: Permanent Traversal Unlocks
            desc: Movement abilities unlocked permanently open new routes across runs (Dead Cells runes).
            keywords: ["new paths", "new routes", runes, "unlock new areas"]
          weapon_mastery:
            name: Weapon Mastery
            desc: Weapons gain persistent levels/perks through use (Witchfire, Returnal traits).
            keywords: ["weapon mastery", "master your weapons", "weapon traits"]
      difficulty_ladder:
        name: Difficulty Ladder
        mechanics:
          ascension_ladder:
            name: Ascension / Heat Ladder
            desc: Stacking post-win difficulty levels (Ascension, Heat, Prestige).
            keywords: [ascension, "heat system", "difficulty levels", "higher difficulties", "difficulty tiers"]
          modular_difficulty:
            name: Modular Difficulty Modifiers
            desc: Player toggles individual handicap modifiers for rewards (Hades Pact).
            keywords: ["modifiers", "customize difficulty", "pact"]
      narrative_meta:
        name: Narrative Meta
        mechanics:
          narrative_across_runs:
            name: Story Progresses Across Runs
            desc: Dying advances narrative; NPCs react to runs (Hades).
            steam_tags: [Story Rich]
            keywords: ["story unfolds", "every death", "each death", "with each run the story"]
          lore_codex:
            name: Codex / Compendium
            desc: Collectible encyclopedia of discovered items/enemies.
            keywords: [codex, compendium, bestiary]
          npc_relationships:
            name: NPC Relationships
            desc: Persistent relationship/affinity meters with characters.
            steam_tags: [Dating Sim, Romance]
            keywords: [relationships, romance, "bond with"]

